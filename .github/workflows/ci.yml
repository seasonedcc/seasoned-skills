name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tsc
      - run: pnpm build
      - run: pnpm test:unit -- --coverage

  golden:
    name: Golden output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:golden

  runtimes:
    name: Supported runtimes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:unit tests/unit/ledger.test.ts tests/unit/hooks.test.ts src/ledger
